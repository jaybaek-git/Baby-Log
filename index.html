<!DOCTYPE html>
<html lang="ko">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">
<title>아기 기록</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--txt:#e8eaed;--sub:#9aa0a6;--btn:#2a2f3a;--inp:#0f1115;--sheet:#1a1d24;--toast:#262b35;--toastb:#39404d;--line2:#3a404c;--sub2:#555b66;
 --ch-col:#161920;--ch-today:#1c2130;--ch-todayb:#3a4256;--ch-grid:#2c313c;--ch-grid2:#1d2129;--ch-ax:#6f7680;--ch-txt:#c9ccd1;--ch-sub:#8a9099;--ch-mk:#0f1115;--ch-sun:#ff8a80;--ch-sat:#82b1ff;color-scheme:dark}
html[data-theme=light]{--bg:#f4f5f7;--card:#ffffff;--line:#e3e5e8;--txt:#1d1f23;--sub:#6b7078;--btn:#eceef1;--inp:#f7f8fa;--sheet:#ffffff;--toast:#ffffff;--toastb:#d9dce1;--line2:#cfd3d8;--sub2:#9aa0a6;
 --ch-col:#f2f3f5;--ch-today:#e9eefb;--ch-todayb:#b9c6e6;--ch-grid:#d8dbe0;--ch-grid2:#e8eaed;--ch-ax:#8a9099;--ch-txt:#3a3f47;--ch-sub:#7a8089;--ch-mk:#5f6670;--ch-sun:#e5484d;--ch-sat:#3b6fd8;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px}
body{padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 40px)}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
header h1{font-size:21px;margin:0;flex:1}
.hb{background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;height:34px;font-size:18px;font-weight:700}
.hb:disabled{opacity:.3}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:#666}
.topbar{position:sticky;top:0;z-index:6;background:var(--bg);margin:calc(-10px - env(safe-area-inset-top)) -12px 10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 6px}
.topbar header{margin-bottom:8px}
.status{margin:0}
.stgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 8px;min-width:0;overflow:hidden}
.st span{display:block;font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b{display:block;font-size:15px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st small{display:block;font-size:10.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ongo{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ongo span{font-size:12px;font-weight:600;background:var(--card);border:1.5px dashed var(--c);border-radius:20px;padding:3px 10px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;overflow:hidden}
.tb::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.tb .e{font-size:26px;line-height:1.2}.tb .n{font-weight:700;font-size:14px}.tb .s{font-size:11px;color:var(--sub);white-space:nowrap}
.tb.on{border-color:var(--c);box-shadow:0 0 0 1.5px var(--c) inset}
.tb.on::after{content:"";position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--c);animation:blink 1.6s ease-in-out infinite;will-change:opacity}
.tb:active{transform:scale(.96)}
@keyframes blink{50%{opacity:.2}}
.tabs{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:10px}
.tabs button{flex:1;background:none;border:0;color:var(--sub);padding:8px;border-radius:8px;font-weight:600}
.tabs button.a{background:var(--btn);color:var(--txt)}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.nav button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.nav button:disabled{opacity:.3}
.nav-t{flex:1;text-align:center;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.lg{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:12px}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block;box-shadow:0 0 0 1px var(--line2)}
.lg.off{opacity:.35;text-decoration:line-through}
.chartwrap{touch-action:pan-y}
.chartwrap svg{display:block;font-family:inherit}
.btn{background:var(--btn);border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.pri{background:#FFD54A;color:#111}.btn.red{background:#e5484d;color:#fff}.btn.wide{width:100%;margin-bottom:10px}
.lh{font-size:13px;color:var(--sub);margin:14px 2px 6px;font-weight:600}
.li{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:10px;padding:9px 11px;margin-bottom:5px}
.li i{width:6px;align-self:stretch;border-radius:3px}
.lm{flex:1}.lt{font-size:12px;color:var(--sub);margin-top:2px}.v{color:#ffd54a}.nt{color:var(--sub);font-size:13px}
.sw{position:relative;margin-bottom:5px;border-radius:10px;overflow:hidden}
.sw .li{margin:0;position:relative;z-index:1;transition:transform .2s ease}
.sw-acts{position:absolute;top:0;bottom:0;right:0;display:flex}
.sw-acts button{border:0;width:72px;font-weight:700;font-size:14px}
.sw-ed{background:#5b6475;color:#fff}.sw-del{background:#e5484d;color:#fff}
.swhint{font-size:12px;color:var(--sub);text-align:right;margin:-4px 2px 4px}
.empty{text-align:center;color:var(--sub);padding:30px}
.sec{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px}
.sec h3{margin:0 0 10px;font-size:15px}
.fld{display:block;margin-bottom:9px}.fld span{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:16px}
.hint{font-size:12px;color:var(--sub);margin:6px 0;line-height:1.5;white-space:pre-line}
.tcard{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.tcard.dis{opacity:.5}
.trow{display:flex;gap:6px;align-items:center;margin-bottom:5px}
.trow input,.trow select{background:var(--inp);border:1px solid var(--line);border-radius:7px;padding:6px;font-size:15px;min-width:0}
.trow input[type=checkbox]{width:22px;height:22px;flex:0 0 22px}
.trow .emo{width:44px;text-align:center}.trow .nm{flex:1}.trow input[type=color]{width:40px;height:34px;padding:2px}
.trow .unit{width:56px}.trow .tags{flex:1}
.ib.mk{color:#6f7680;width:36px;flex-basis:36px}.ib.mk.on{color:var(--txt);background:var(--line2);outline:1.5px solid #9aa0a6}
.ib{background:var(--btn);border:0;border-radius:7px;width:32px;height:32px;flex:0 0 32px}
.cr{display:flex;gap:6px;align-items:center;margin:4px 0;font-size:12px}
.cr span{width:44px;color:var(--sub)}.cr code{flex:1;background:var(--inp);padding:5px 7px;border-radius:6px;word-break:break-all;font-size:12px}
.cr button{background:var(--btn);border:0;border-radius:6px;padding:5px 8px;font-size:12px}
.sc{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.sct{font-weight:600;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{background:var(--btn);border:0;border-radius:18px;padding:7px 13px;font-size:14px}
.chip.big{padding:11px 16px;font-size:16px;font-weight:600}
.chip.ghost{background:none;border:1px solid var(--line2)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--sheet);width:100%;border-radius:16px 16px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);max-height:88vh;overflow:auto}
.sheet-h{display:flex;align-items:center;font-weight:700;font-size:17px;margin-bottom:10px}
.sheet-h div{flex:1}.x{background:none;border:0;font-size:18px;color:var(--sub)}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tpick{background:var(--btn);border:1.5px solid transparent;border-radius:10px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:600}
.tpick.on{border-color:var(--c);background:var(--card);box-shadow:0 0 0 1px var(--c) inset}
.sheet-a{display:flex;gap:8px;margin-top:6px}.sheet-a .btn{flex:1;padding:13px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);background:var(--toast);border:1px solid var(--toastb);box-shadow:0 4px 18px rgba(0,0,0,.18);border-radius:14px;padding:11px 13px;z-index:30;transform:translateY(160%);transition:transform .25s}
#toast.show{transform:none}
.tm{font-weight:600}.tr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tr .chip{padding:6px 12px}
.ver{text-align:center;color:var(--sub2);font-size:11px;margin-top:10px}
</style>
</head>
<body>
<div class="topbar"><header><h1 id="title">아기 기록</h1><button class="hb" id="undoB" disabled onclick="undoLast()" aria-label="되돌리기">↶</button><button class="hb" id="redoB" disabled onclick="redoLast()" aria-label="다시 실행">↷</button><div class="sync"><span class="dot" id="dot"></span><span id="synctxt">로컬</span></div></header>
<div class="status" id="status"></div></div>
<div class="btns" id="btns"></div>
<div class="tabs"><button data-t="chart" class="a">차트</button><button data-t="list">목록</button><button data-t="settings">설정</button></div>
<div id="panel"></div>
<div id="toast"></div>
<script>
function applyTheme(){let t='dark';try{t=JSON.parse(localStorage.getItem('bl_theme'))||'dark'}catch(e){}
 if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
 document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='light'?'#f4f5f7':'#0f1115'}
applyTheme();
const APP_VERSION='v1.6.3';
const DEFAULT_TYPES=[
 {id:'breast',name:'모유수유',emoji:'🤱',color:'#FFD54A',kind:'duration',enabled:true,feed:true,ends:['sleep'],tags:['왼쪽','오른쪽','양쪽']},
 {id:'formula',name:'분유',emoji:'🍼',color:'#FF9F43',kind:'point',enabled:true,feed:true,ends:['sleep'],unit:'ml',presets:[20,40,60,80,100,120],defaultValue:60},
 {id:'diaper',name:'기저귀',emoji:'💧',color:'#4DA3FF',kind:'point',enabled:true,ends:['sleep'],tags:['소변','대변','둘다']},
 {id:'sleep',name:'수면',emoji:'😴',color:'#9B7BFF',kind:'duration',enabled:true},
 {id:'bath',name:'목욕',emoji:'🛁',color:'#FFFFFF',kind:'point',enabled:false,marker:true,alsoLog:['diaper'],ends:['sleep']},
 {id:'temp',name:'체온',emoji:'🌡️',color:'#FF6B6B',kind:'point',enabled:false,unit:'°C',presets:[36.5,36.8,37.0,37.5],marker:true},
 {id:'vitamin',name:'비타민',emoji:'💊',color:'#4CD97B',kind:'point',enabled:false,marker:true},
 {id:'tummy',name:'터미타임',emoji:'🐢',color:'#2EC4B6',kind:'duration',enabled:false},
 {id:'etc',name:'기타',emoji:'📝',color:'#9AA0A6',kind:'point',enabled:false,askNote:true},
 {id:'recA',name:'기록A',emoji:'🅰️',color:'#FF7EB6',kind:'point',enabled:false},
 {id:'recB',name:'기록B',emoji:'🅱️',color:'#7EE0FF',kind:'point',enabled:false}
];
const DEFAULT_ALARM={enabled:true,mode:'auto',fixedMin:120,leadMin:0,statsDays:3};
const WD=['일','월','화','수','목','금','토'];
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function h(tag,attrs,...kids){const el=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(k==='class')el.className=v;else if(k==='style')el.style.cssText=v;else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)el.setAttribute(k,v===true?'':v)}for(const c of kids.flat(3)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c))}return el}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dayStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtHM=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtMD=d=>{d=new Date(d);return (d.getMonth()+1)+'/'+d.getDate()};
const toLocalInput=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
function ago(ms){const m=Math.max(0,Math.floor(ms/6e4)),hh=Math.floor(m/60);return hh?`${hh}시간 ${m%60}분`:`${m}분`}
function agoS(ms){const m=Math.max(0,Math.floor(ms/6e4)),hh=Math.floor(m/60);return hh?`${hh}:${pad(m%60)}`:`${m}분`}
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'l'+Date.now().toString(36)+Math.random().toString(36).slice(2));

let dev=LS.get('bl_dev',{url:'',key:'',code:'',who:''});
let config=mergeDefaults(LS.get('bl_config',null)||{babyName:'',types:JSON.parse(JSON.stringify(DEFAULT_TYPES))});
let swipeBusy=false,openSw=null,alarmInfo=null;
let events=[],weekOffset=0,tab='chart',hidden=new Set(LS.get('bl_hidden',[]));
function mergeDefaults(c){c.types=c.types||[];c.alarm={...DEFAULT_ALARM,...(c.alarm||{})};c.types.forEach(t=>{const d=DEFAULT_TYPES.find(x=>x.id===t.id);if(d&&t.marker===undefined&&d.marker)t.marker=true;if(d&&t.alsoLog===undefined&&d.alsoLog)t.alsoLog=[...d.alsoLog];if(d&&t.ends===undefined&&d.ends)t.ends=[...d.ends];if(d&&t.defaultValue===undefined&&d.defaultValue!=null)t.defaultValue=d.defaultValue});const ids=new Set(c.types.map(t=>t.id));DEFAULT_TYPES.forEach(d=>{if(!ids.has(d.id))c.types.push({...d,enabled:false})});return c}
const T=id=>config.types.find(t=>t.id===id)||{id,name:id,emoji:'•',color:'#888',kind:'point'};
const appTitle=()=>config.title||(config.babyName?`${config.babyName} 기록`:'아기 기록');
const addType=()=>config.types.find(t=>t.id==='formula'&&t.enabled)||firstEnabled();
const firstEnabled=()=>config.types.find(t=>t.enabled)||config.types[0];
const isOpen=e=>T(e.type).kind==='duration'&&!e.end_at&&(Date.now()-new Date(e.start_at))<864e5;
const remote=()=>!!(dev.url&&dev.key&&dev.code);

async function rpc(fn,args){
 const hd={'apikey':dev.key,'Content-Type':'application/json'};
 if(dev.key.startsWith('eyJ'))hd.Authorization='Bearer '+dev.key;
 const r=await fetch(dev.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:hd,body:JSON.stringify(args)});
 const t=await r.text();
 if(!r.ok){let m=t;try{m=JSON.parse(t).message||t}catch(e){}throw new Error(m)}
 return t?JSON.parse(t):null;
}
const localAll=()=>LS.get('bl_events',[]);
const store={
 async list(from,to){
  if(remote())return (await rpc('list_events',{p_code:dev.code,p_from:from.toISOString(),p_to:to.toISOString()}))||[];
  const now=Date.now();
  return localAll().filter(e=>{const a=+new Date(e.start_at);let b=e.end_at?+new Date(e.end_at):(isOpen(e)?now:a);return a<+to&&b>=+from});
 },
 async add(e){
  if(remote()){const r=await rpc('add_event',{p_code:dev.code,p_type:e.type,p_start:e.start_at,p_end:e.end_at||null,p_value:e.value??null,p_note:e.note||null,p_by:e.created_by||dev.who||null});
   for(const l of (T(e.type).ends||[]))for(const x of events.filter(x=>x.type===l&&isOpen(x)&&+new Date(x.start_at)<=+new Date(r.start_at)))
    {try{await rpc('update_event',{p_code:dev.code,p_id:x.id,p_type:x.type,p_start:x.start_at,p_end:r.start_at,p_value:x.value??null,p_note:x.note||null})}catch(_){}}
   return r}
  const all=localAll();const n={id:uid(),end_at:null,value:null,note:null,created_by:dev.who||null,...e};
  (T(n.type).ends||[]).forEach(l=>all.filter(x=>x.type===l&&isOpen(x)&&+new Date(x.start_at)<=+new Date(n.start_at)).forEach(x=>{x.end_at=n.start_at}));
  all.push(n);
  (T(n.type).alsoLog||[]).filter(l=>l!==n.type).forEach(l=>all.push({id:uid(),type:l,start_at:n.start_at,end_at:null,value:null,note:T(n.type).name+' 때 함께',created_by:n.created_by}));
  LS.set('bl_events',all);return n;
 },
 async toggle(type){
  if(remote())return rpc('toggle_event',{p_code:dev.code,p_type:type,p_by:dev.who||null});
  const all=localAll();const open=all.filter(e=>e.type===type&&isOpen(e)).sort((a,b)=>new Date(b.start_at)-new Date(a.start_at))[0];
  if(open){open.end_at=new Date().toISOString();LS.set('bl_events',all);return {action:'stop',event:open}}
  return {action:'start',event:await store.add({type,start_at:new Date().toISOString()})};
 },
 async update(e){
  if(remote())return rpc('update_event',{p_code:dev.code,p_id:e.id,p_type:e.type,p_start:e.start_at,p_end:e.end_at||null,p_value:e.value??null,p_note:e.note||null});
  const all=localAll();const i=all.findIndex(x=>x.id===e.id);if(i>=0)all[i]={...all[i],...e};LS.set('bl_events',all);return all[i];
 },
 async remove(id){
  if(remote())return rpc('delete_event',{p_code:dev.code,p_id:id});
  LS.set('bl_events',localAll().filter(e=>e.id!==id));
 },
 async bulk(rows){
  if(remote())return rpc('import_events',{p_code:dev.code,p_rows:rows});
  const all=localAll();rows.forEach(r=>all.push({id:uid(),end_at:null,value:null,note:null,created_by:null,...r}));LS.set('bl_events',all);return rows.length;
 },
 async all(){
  if(remote())return (await rpc('list_events',{p_code:dev.code,p_from:'2000-01-01T00:00:00Z',p_to:'2100-01-01T00:00:00Z'}))||[];
  return localAll();
 }
};
async function loadConfig(){
 if(!remote())return;
 try{const c=await rpc('get_config',{p_code:dev.code});
  if(c&&c.types&&c.types.length){const had=!!c.alarm;config=mergeDefaults(c);LS.set('bl_config',config);if(!had)await rpc('set_config',{p_code:dev.code,p_data:config})}
  else await rpc('set_config',{p_code:dev.code,p_data:config});
 }catch(e){setSync('err',e.message)}
}
async function saveConfig(){LS.set('bl_config',config);if(remote())await rpc('set_config',{p_code:dev.code,p_data:config})}

function setSync(s,msg){
 $('#dot').style.background=s==='ok'?'#4CD97B':s==='err'?'#FF6B6B':'#666';
 $('#synctxt').textContent=s==='ok'?'동기화':s==='err'?'연결 오류':'로컬';
 $('#synctxt').title=msg||'';
}
function weekRange(){const end=addDays(dayStart(new Date()),1-7*weekOffset);return {start:addDays(end,-7),end}}
let refreshing=0;
async function refresh(){
 const my=++refreshing;const {start,end}=weekRange();const now=Date.now();

 const api={close};
 front.addEventListener('touchstart',ev=>{if(openSw&&openSw!==api)openSw.close();sx=ev.touches[0].clientX;sy=ev.touches[0].clientY;base=dx;drag=null},{passive:true});

 text.split(/\r?\n/).forEach(line=>{
  const m=line.match(/^(.*?)(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/);if(!m)return;
  const label=m[1].replace(/[^\p{L}\p{N}\s]/gu,'').trim();
  const t=label==='수유'?T('breast'):(config.types.find(t=>t.name===label)||config.types.find(t=>label&&(label.includes(t.name)||t.name.includes(label))));
  if(!t)return;
  const d=new Date(now.getFullYear(),+m[2]-1,+m[3],+m[4],+m[5]);if(d>now)d.setFullYear(d.getFullYear()-1);
  out.push({type:t.id,start_at:d.toISOString(),end_at:t.kind==='duration'?d.toISOString():null});
 });
 return out;
}

   h('div',{style:'display:flex;gap:8px;margin:6px 0 10px'},h('button',{class:'btn',onclick:async()=>{try{await rpc('backup_now',{p_code:dev.code});toast('지금 백업했어요');loadB()}catch(e){alert(e.message)}}},'지금 백업'),h('button',{class:'btn',onclick:loadB},'새로고침')),

function b64uToU8(b){const pad='='.repeat((4-b.length%4)%4);const raw=atob((b+pad).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(raw,c=>c.charCodeAt(0))}
async function swReg(){if(!('serviceWorker' in navigator))return null;try{return await navigator.serviceWorker.register('sw.js')}catch(e){return null}}
async function enablePush(){
 if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))
  throw new Error('이 화면에서는 알림을 쓸 수 없어요. 사파리 → 공유 → 홈 화면에 추가 후, 홈 화면 아이콘으로 연 앱에서 눌러 주세요 (iOS 16.4 이상).');
 const perm=await Notification.requestPermission();
 if(perm!=='granted')throw new Error('알림 권한이 꺼져 있어요. 아이폰 설정 → 알림 → 아기 기록에서 허용해 주세요.');
 const reg=await swReg();await navigator.serviceWorker.ready;
 const pub=await rpc('get_vapid_public',{p_code:dev.code});
 if(!pub)throw new Error('서버에 알림 키(VAPID)가 아직 없어요. 설정 안내의 키 입력 SQL을 실행해 주세요.');
 let sub=await reg.pushManager.getSubscription();
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToU8(pub)});
 await rpc('save_push_sub',{p_code:dev.code,p_sub:sub.toJSON(),p_who:dev.who||null});
 LS.set('bl_push',true);
}
async function pushState(){
 if(!('serviceWorker' in navigator)||!('PushManager' in window))return '미지원 (홈 화면 앱에서 열어 주세요)';
 try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();
  return sub?'✅ 이 폰은 알림을 받고 있어요':'이 폰은 아직 알림 등록 전이에요'}catch(e){return '확인 불가'}
}

  h('button',{class:'btn pri',onclick:async()=>{
   config.alarm={enabled:en.checked,mode:mode.value,fixedMin:Math.max(15,+fixed.value||120),statsDays:Math.min(30,Math.max(1,+days.value||3)),leadMin:Math.max(0,+lead.value||0)};
   try{await saveConfig();await refresh();renderTab();toast('알림 설정 저장됨')}catch(e){alert('저장 실패: '+e.message)}}},'알림 설정 저장'),
  info,
  h('div',{style:'border-top:1px solid var(--line);margin-top:10px;padding-top:10px'},

    h('button',{class:'btn',onclick:async()=>{try{st.textContent='등록 중…';await enablePush();st.textContent='✅ 이 폰은 알림을 받고 있어요';toast('알림 등록 완료')}catch(e){st.textContent='❌ '+e.message}}},'이 폰에서 알림 받기'),
    h('button',{class:'btn',onclick:async()=>{try{await rpc('test_push',{p_code:dev.code,p_by:dev.who||null});toast('테스트 알림 보냄 (몇 초 걸려요)')}catch(e){alert('실패: '+e.message)}}},'테스트 알림'))));
}
